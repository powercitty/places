# CI obrigatório (constituição). Um PR só entra se todos estes passarem.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras:
    name: regras da casa e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: node policies/regras.mjs
      - run: mise exec gitleaks@8.30.1 -- gitleaks git --redact --no-banner

  testes:
    name: tipos, testes e contrato
    needs: regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  banco:
    name: migrações do Supabase
    needs: regras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/testar-banco.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin

  agente:
    name: build do agente (${{ matrix.maquina }})
    needs: testes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        maquina: [lab-256, lab-512, lab-8gb]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: apps/agent
        env:
          MAQUINA: ${{ matrix.maquina }}

  tela:
    name: build do coloured-places
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: apps/coloured-places
        env:
          NEXT_TELEMETRY_DISABLED: "1"
